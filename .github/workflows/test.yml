name: generic branding checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check admin-redesign.js && node --check admin-date-tools.js && node --check checklist-presets-data.js && node --check checklist-presets.js && node --check multi-shift.js && node --check staff-calendar.js && node --check build.mjs
      - name: Run regression tests
        run: npm test
